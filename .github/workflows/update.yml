name: Sıralamayı güncelle

on:
  schedule:
    # GitHub zamanlanmış işleri geciktirebilir (eskiden 3-8 saat gecikme görüldü).
    - cron: "20 18 * * *" # her gün 18:20 UTC = 21:20 TSİ
    - cron: "20 6 * * 2" # ayrıca Salı 06:20 UTC = 09:20 TSİ
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-standings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv v8'den beri yalnızca tam sürüm etiketi yayınlıyor (@v10 yok).
      - uses: astral-sh/setup-uv@v10.4.0

      - run: uv sync --locked

      - run: uv run pytest -q

      - name: Verileri çek ve sayfayı oluştur
        env:
          TFF_EMAIL: ${{ secrets.TFF_EMAIL }}
          TFF_PASSWORD: ${{ secrets.TFF_PASSWORD }}
        run: uv run python -m krallar

      - name: Cache ve sayfayı commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site
          git diff --cached --quiet && exit 0
          git commit -m "Sıralama güncellendi"
          # "Re-run" eski commit'i checkout eder; main ilerlediyse önce üstüne al.
          # Çakışmada bu çalıştırmanın yeni ürettiği data/ ve site/ geçerli (rebase'de -X theirs).
          git pull --rebase -X theirs origin main
          git push

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Ayrı iş: aynı işte yükleme ve yayınlama arka arkaya olunca deploy-pages yeni yüklenen
  # artifact'i bazen bulamıyordu ("No artifacts named github-pages"). GitHub'ın önerdiği yapı.
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
