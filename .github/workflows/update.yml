name: Sıralamayı güncelle

on:
  schedule:
    - cron: "59 20 * * 5,6,0,2" # Cuma, Cumartesi, Pazar, Salı 20:59 UTC = 23:59 TSİ
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-standings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - run: uv sync --locked

      - run: uv run pytest -q

      - name: Verileri çek ve sayfayı oluştur
        env:
          TFF_EMAIL: ${{ secrets.TFF_EMAIL }}
          TFF_PASSWORD: ${{ secrets.TFF_PASSWORD }}
        run: uv run python -m krallar

      - name: Cache ve sayfayı commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site
          git diff --cached --quiet || git commit -m "Sıralama güncellendi" && git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
